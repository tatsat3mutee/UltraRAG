# Any OpenAI-compatible endpoint. Examples:
#   OpenAI:     OPENAI_API_KEY=sk-...
#   Groq chat:  OPENAI_BASE_URL=https://api.groq.com/openai  CHAT_MODEL=llama-3.3-70b-versatile
#               (Groq has no embeddings endpoint: combine with the ollama profile's embeddings
#                or set rag.embedding.provider=hashing)
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4.1-mini}
          temperature: 0.1
      embedding:
        base-url: ${OPENAI_EMBEDDING_BASE_URL:https://api.openai.com}
        options:
          model: text-embedding-3-small
          dimensions: 1536

rag:
  embedding:
    provider: spring-ai
    model-name: openai/text-embedding-3-small
    dimensions: 1536
  generation:
    provider: llm
