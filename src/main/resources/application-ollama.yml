# Fully local: ollama pull llama3.2 && ollama pull nomic-embed-text
spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${CHAT_MODEL:llama3.2}
          temperature: 0.1
      embedding:
        options:
          model: nomic-embed-text

rag:
  embedding:
    provider: spring-ai
    model-name: ollama/nomic-embed-text
    dimensions: 768
  generation:
    provider: llm
